<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section data-view="home">
      <header class="bar">
        <h1>FlashNotes</h1>
        <button type="button" id="new-set-btn" class="primary">New set</button>
      </header>
      <p id="empty-msg" class="muted">No sets yet — create one to get started.</p>
      <ul id="set-list" class="set-list"></ul>
    </section>

    <section data-view="create" hidden>
      <h2>New set</h2>
      <form id="create-form" novalidate>
        <label for="set-name">Set name</label>
        <input type="text" id="set-name" autocomplete="off">

        <h3>Cards</h3>
        <div id="card-rows"></div>
        <button type="button" id="add-card-btn">Add card</button>

        <div id="form-errors" class="errors" role="alert" hidden></div>

        <div class="form-actions">
          <button type="submit" class="primary">Save</button>
          <button type="button" id="cancel-create-btn">Cancel</button>
        </div>
      </form>
    </section>

    <section data-view="study" hidden>
      <header class="bar">
        <h2 id="study-title" class="study-title"></h2>
        <button type="button" id="study-back-btn">Back to sets</button>
      </header>
      <div id="study-card" class="study-card" role="button" tabindex="0">
        <span id="study-side" class="side-label"></span>
        <p id="study-text" class="study-text"></p>
      </div>
      <p class="muted hint">Click the card or press Space to flip. Use ← and → to move.</p>
      <div class="study-nav">
        <button type="button" id="study-prev-btn">Prev</button>
        <span id="study-position" class="study-position"></span>
        <button type="button" id="study-next-btn">Next</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
